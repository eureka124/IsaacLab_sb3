seed: 123
models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
    - name: net
      input: concatenate([STATES["robot-state"], STATES["critic-state"]])
      layers:
      - 256
      - 256
      activations: leaky_relu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
    - name: net
      input: concatenate([STATES["robot-state"], STATES["critic-state"]])
      layers:
      - 256
      - 256
      activations: leaky_relu
    output: ONE

memory:
  class: RandomMemory
  # 修改点 1: 明确大小
  memory_size: 512

agent:
  class: PPO
  rollouts: 512
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 0.0003
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016
  state_preprocessor: null 
  state_preprocessor_kwargs: null
  value_preprocessor: null
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  experiment:
    directory: "quad"
    experiment_name: ""
    write_interval: 500
    checkpoint_interval: auto
trainer:
  class: SequentialTrainer
  timesteps: 256000
  environment_info: log
  close_environment_at_exit: false
