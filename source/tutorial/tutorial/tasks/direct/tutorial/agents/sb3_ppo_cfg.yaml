# Reference: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml#L32
seed: 123

n_timesteps: !!float 256000
policy: 'MultiInputPolicy'
n_steps: 512
batch_size: 512
gae_lambda: 0.95
gamma: 0.99
n_epochs: 5
ent_coef: 0.0
learning_rate: !!float 3e-4
clip_range: !!float 0.2
clip_range_vf: !!float 0.2
policy_kwargs:
  activation_fn: nn.LeakyReLU
  net_arch:
    pi: [512, 512]
    vf: [512, 512]
  squash_output: False
  log_std_init: 0.0
vf_coef: 2.0
max_grad_norm: 1.0
device: "cuda:0"